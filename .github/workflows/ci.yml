# 合并前的完整门禁。`gates` 这个 job 跑的与 .githooks/pre-push 是同一套检查；
# `runtime-diff` 那个 job **只在 CI 跑**（见它自己的注释）。
#
# 其中三条是 docs/decisions/dual-target-axum.md **明确承诺外包给 CI** 的红线：
#   1. crates/site 每一行都必须编到 wasm32-unknown-unknown
#   2. xtask render-diff：两条内容路径渲染结果逐字节一致
#   3. xtask runtime-diff：wasm32 **运行时**的输出与构建期渲染逐字节一致
# 在此之前 1 与 2 只有本地 pre-push 在跑，也就是「靠每个人都装了钩子」；
# 3 则根本没有 —— 那条 ADR 的判据长期只兑现了一半。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 文件卫生（密钥 / 体积 / 换行 / 空白）
        run: python3 .githooks/checks/hygiene.py --all

      - name: 文档规则（命名 / 文首必填 / 链接锚点 / 索引 / 计数）
        run: python3 .githooks/checks/docs.py

      # 部署的 IaC 和 Rust 代码同等待遇：它一样会腐烂，
      # 而它腐烂的症状是「要部署的那天才发现配置不合法」。
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform 格式（含子模块，-recursive）
        run: terraform fmt -check -diff -recursive cloudflare/terraform

      - name: Terraform 配置合法性
        # 两层都要查：根模块过了不代表子模块自身合法（外部消费者用的是后者）。
        # -backend=false：CI 不需要也不应该碰 state。
        run: |
          terraform -chdir=cloudflare/terraform init -backend=false -input=false
          terraform -chdir=cloudflare/terraform validate
          terraform -chdir=cloudflare/terraform/modules/worker init -backend=false -input=false
          terraform -chdir=cloudflare/terraform/modules/worker validate

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      - name: lint（warning 即失败）
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: 测试
        run: cargo test --workspace

      # ── ADR 红线 1：wasm32 编译约束 ──
      # crates/site 是零 I/O 硬约束的载体；crates/edge 是线上入口。
      # 两个都要单独查 —— site 编得过但 edge 的胶水编不过，等于线上没有站。
      - name: wasm32 编译约束（crates/site）
        run: cargo check -p site --target wasm32-unknown-unknown

      - name: wasm32 编译约束（crates/edge）
        run: cargo check -p edge --target wasm32-unknown-unknown

      - name: 内容校验（五类硬失败）
        run: cargo run -p xtask -- validate

      # ── ADR 红线 2：两条内容路径逐字节一致 ──
      - name: render-diff
        run: cargo run -p xtask -- render-diff

      # 构建管线本身也是门禁：dump-html 或 Pagefind 挂了，
      # 「能部署」这个前提就已经不成立，不该等到 deploy 时才发现。
      - name: 静态导出 + Pagefind 索引
        run: cargo run -p xtask -- build-site

      - name: 产物抽查
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d public/pagefind
          test -f public/pagefind/pagefind-ui.js
          echo "dist 页面数: $(find dist -name index.html | wc -l)"

          # Pagefind 一页一个 fragment，而索引范围是「只索引工具页」——
          # 所以 fragment 数必须等于条目数。这条同时拦两件事：
          #   · 产物目录没清干净（旧分片留下 → 偏大。2026-08-23 真踩过：本地连着 build
          #     两次就是 195 个文件而不是 114，apply 会把旧分片一起上传）
          #   · 索引范围变了（多索引了列表页 → 偏大；漏索引 → 偏小）
          # ⚠️ 索引范围若是**有意**改的，就来改这条断言 —— 别把它删掉。
          frags=$(find public/pagefind/fragment -type f | wc -l | tr -d ' ')
          tools=$(ls content/tools/*.toml | wc -l | tr -d ' ')
          echo "pagefind fragment: $frags / 条目: $tools"
          test "$frags" -eq "$tools" \
            || { echo "::error::fragment 数 $frags ≠ 条目数 $tools"; exit 1; }

  # ── ADR 红线 3：wasm32 **运行时**的输出必须和构建期渲染逐字节一致 ──
  #
  # gates 里的 render-diff 比的是两条**内容路径**（磁盘 vs 构建期内嵌），但两侧都是
  # native 渲染 —— 它证明不了「编成 wasm 跑起来也一样」。这个 job 对着真产物比：
  # wrangler dev 起一个本地 Worker（跑的是 worker-build 出来的 wasm + JS shim），
  # 再用同一份 all_paths() 逐条请求。
  #
  # ⚠️ **单独一个 job、且不进 pre-push**：它要 node + wrangler + worker-build，
  # 本地每次 push 都装一遍不划算；独立成 job 则与 gates 并行，不拖长 PR 的关键路径。
  # ☠️ 它顺带比**状态码** —— 2026-08-23 那次 soft 404（未命中返回 200、页面内容却是对的）
  # 逐字节比对根本发现不了，只有比状态码才拦得住。
  runtime-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 资源目录（../../public）是 build-site 的产物；它不存在 wrangler dev 起不来。
      - name: 构建期渲染 + 资源层
        run: cargo run -p xtask -- build-site

      # ☠️ 这个 job 的可信度全靠「本地 Worker 与线上跑的是同一个运行时」。
      # compatibility_date 有**两份字面量**：wrangler.jsonc（这里起的 Worker 用）与
      # modules/worker/variables.tf 的默认值（线上用）。它们漂了的话这道门禁照样全绿，
      # 只是验的不再是线上那个运行时 —— 两边都「看着正常」，最难查的一种。
      # ⚠️ 解析不出来也必须红：两个空串相等，那就成了一条恒真的断言。
      - name: compatibility_date 两处必须一致
        run: |
          date_re='[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}'
          a=$(grep -o "\"compatibility_date\": *\"$date_re\"" crates/edge/wrangler.jsonc \
              | grep -o "$date_re")
          b=$(grep -A9 'variable "compatibility_date"' \
                cloudflare/terraform/modules/worker/variables.tf \
              | grep -o "default *= *\"$date_re\"" | grep -o "$date_re")
          echo "wrangler.jsonc=$a  modules/worker 默认=$b"
          test -n "$a" && test -n "$b" \
            || { echo "::error::没解析出 compatibility_date —— 格式变了，来修这条检查"; exit 1; }
          test "$a" = "$b" \
            || { echo "::error::compatibility_date 不一致：wrangler.jsonc=$a，modules/worker=$b"; exit 1; }

      - name: 起本地 Worker
        run: |
          cargo install -q worker-build
          cd crates/edge
          # wrangler.jsonc 里的 build.command 会让它自己跑 worker-build --release。
          # 版本钉在大版本 4：wrangler 的大版本会改 dev 的默认行为（本地/远程）。
          npx --yes wrangler@4 dev --port 8787 --ip 127.0.0.1 \
            --show-interactive-dev-session=false > /tmp/wrangler-dev.log 2>&1 &
          # fail-closed 地等就绪：起不来就把日志打出来再红，不能静默跳过这道门禁。
          curl -sS --retry-connrefused --retry 60 --retry-delay 2 --retry-max-time 240 \
            -o /dev/null http://127.0.0.1:8787/ \
            || { echo "::error::wrangler dev 没起来，runtime-diff 无法执行"; cat /tmp/wrangler-dev.log; exit 1; }

      - name: runtime-diff（wasm32 运行时 vs 构建期渲染）
        run: cargo run -p xtask -- runtime-diff

      - name: wrangler 日志
        if: failure()
        run: cat /tmp/wrangler-dev.log
