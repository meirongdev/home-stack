# 段 4 的 GitHub 侧自动化：每夜抓一次上游活跃度，有变化就提交。
#
# ⚠️ 这个 workflow **只碰 GitHub / GitLab 公开 API**。
# 规格里的 Prometheus 侧（经 Tailscale 进 homelab 抓实测 footprint）**没有实现** ——
# 按 docs/plans/2026-08-20-data-pipeline.md 自己的判据，那一侧只服务 FieldNote 的
# footprint 字段，而目前 FieldNote 是 0 条：现在做等于为零个消费者引入一条
# 跨仓库 Tailscale ACL 依赖。见 docs/ROADMAP.md 开放项 4 / 5。
#
# fail-soft 是 fetch 自己的契约（抓不到就保留旧值），所以这里不加 continue-on-error：
# 真失败了应该看得见，而不是每夜静默绿灯。
name: nightly-fetch

on:
  schedule:
    # 18:20 UTC —— 避开整点，GitHub 的 cron 在整点最挤（延迟可达几十分钟）。
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 抓上游活跃度
        env:
          # 默认的 GITHUB_TOKEN 就够：只读公开仓库的 stars / pushedAt / release。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run -p xtask -- fetch

      # 抓完必须立刻校验：repo.json 的 key 必须对得上真实条目的 slug
      # （条目改名后忘了重抓，页面上就会挂着一份对不上任何条目的数字）。
      - name: 校验产物
        run: cargo run -p xtask -- validate

      - name: 有变化就提交
        run: |
          if git diff --quiet -- content/generated/repo.json; then
            echo "上游活跃度无变化，不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated/repo.json
          git commit -m "chore(data): 夜间刷新上游活跃度快照

          由 .github/workflows/nightly-fetch.yml 生成 —— 不要手改
          content/generated/repo.json，改了会被下一次抓取覆盖。"
          git push
