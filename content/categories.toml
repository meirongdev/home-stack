# 域内分类声明。id 必须与工具条目里的 categories 引用一致，
# domain 必须与该条目的 domain 一致 —— 跨域引用是硬失败（load.rs 校验 2）。
#
# 分类是**域内**的第二根轴：「指标」只在可观测域里有意义，「CNI」只在网络域里有意义。
# 摊平成一层就得到一个三十多项、彼此不可比的平铺清单。

